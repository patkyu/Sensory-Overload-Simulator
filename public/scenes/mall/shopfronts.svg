<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- PLACEHOLDER: mall corridor with shopfronts. No words in the art: shop names live in i18n. -->
  <rect width="800" height="600" fill="#e9e4da"/>
  <rect width="800" height="130" fill="#d8d2c6"/>
  <polygon points="0,420 800,420 800,600 0,600" fill="#cfc6b6"/>
  <g stroke="#b9ae9b" stroke-width="3">
    <line x1="400" y1="420" x2="-200" y2="600"/><line x1="400" y1="420" x2="100" y2="600"/><line x1="400" y1="420" x2="400" y2="600"/>
    <line x1="400" y1="420" x2="700" y2="600"/><line x1="400" y1="420" x2="1000" y2="600"/>
    <line x1="0" y1="460" x2="800" y2="460"/><line x1="0" y1="520" x2="800" y2="520"/>
  </g>
  <g>
    <rect x="10" y="170" width="120" height="250" fill="#ffffff"/><rect x="10" y="170" width="120" height="28" fill="#2a9d8f"/>
    <rect x="140" y="170" width="120" height="250" fill="#ffffff"/><rect x="140" y="170" width="120" height="28" fill="#e76f51"/>
    <rect x="270" y="170" width="120" height="250" fill="#ffffff"/><rect x="270" y="170" width="120" height="28" fill="#457b9d"/>
    <rect x="400" y="170" width="120" height="250" fill="#ffffff"/><rect x="400" y="170" width="120" height="28" fill="#f4a261"/>
    <rect x="530" y="170" width="120" height="250" fill="#ffffff"/><rect x="530" y="170" width="120" height="28" fill="#9b5de5"/>
    <rect x="660" y="170" width="130" height="250" fill="#ffffff"/><rect x="660" y="170" width="130" height="28" fill="#e63946"/>
  </g>
  <g fill="#bde0fe" opacity="0.7">
    <rect x="22" y="210" width="96" height="200"/><rect x="152" y="210" width="96" height="200"/><rect x="282" y="210" width="96" height="200"/>
    <rect x="412" y="210" width="96" height="200"/><rect x="542" y="210" width="96" height="200"/><rect x="672" y="210" width="106" height="200"/>
  </g>
  <!-- pharmacy cross on the first shop -->
  <g fill="#2a9d8f"><rect x="58" y="260" width="24" height="70"/><rect x="35" y="283" width="70" height="24"/></g>
  <g fill="#6c757d" opacity="0.6">
    <rect x="160" y="330" width="80" height="20"/><rect x="290" y="300" width="30" height="80"/><rect x="330" y="320" width="30" height="60"/>
    <circle cx="460" cy="300" r="25"/><rect x="560" y="280" width="60" height="100"/><rect x="690" y="260" width="30" height="120"/><rect x="730" y="290" width="30" height="90"/>
  </g>
